<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="960" viewBox="0 0 1300 960"><rect width="100%" height="100%" fill="#0c1220"/>
<text x="650.0" y="62" font-family="Inter" font-size="42" font-weight="bold" fill="#e8eef6" text-anchor="middle">The Four Quadrants of Operant Conditioning</text>
<text x="650.0" y="104" font-family="Inter" font-size="22" font-weight="normal" fill="#9aabc0" text-anchor="middle" font-style="italic">Positive (+) means something is added. Negative (-) means something is taken away.</text>
<text x="500.0" y="152" font-family="Inter" font-size="26" font-weight="bold" fill="#6eb6e8" text-anchor="middle">REINFORCEMENT</text>
<text x="1000.0" y="152" font-family="Inter" font-size="26" font-weight="bold" fill="#f2a65a" text-anchor="middle">PUNISHMENT</text>
<text x="500.0" y="182" font-family="Inter" font-size="19" font-weight="normal" fill="#9aabc0" text-anchor="middle" font-style="italic">makes a behaviour more likely</text>
<text x="1000.0" y="182" font-family="Inter" font-size="19" font-weight="normal" fill="#9aabc0" text-anchor="middle" font-style="italic">makes a behaviour less likely</text>
<text x="226" y="371.5" font-family="Inter" font-size="26" font-weight="bold" fill="#e8eef6" text-anchor="end">POSITIVE +</text>
<text x="226" y="401.5" font-family="Inter" font-size="19" font-weight="normal" fill="#9aabc0" text-anchor="end" font-style="italic">something added</text>
<text x="226" y="726.5" font-family="Inter" font-size="26" font-weight="bold" fill="#e8eef6" text-anchor="end">NEGATIVE -</text>
<text x="226" y="756.5" font-family="Inter" font-size="19" font-weight="normal" fill="#9aabc0" text-anchor="end" font-style="italic">something removed</text>
<rect x="256" y="206" width="488" height="343" rx="10" fill="#1a2438" stroke="#6eb6e8" stroke-width="2.5"/>
<text x="280" y="264" font-family="Inter" font-size="46" font-weight="bold" fill="#6eb6e8" text-anchor="start">+R</text>
<text x="500.0" y="350" font-family="Inter" font-size="24" font-weight="bold" fill="#e8eef6" text-anchor="middle">Add something the dog</text>
<text x="500.0" y="382" font-family="Inter" font-size="24" font-weight="bold" fill="#e8eef6" text-anchor="middle">wants, so the behaviour grows.</text>
<text x="500.0" y="440" font-family="Inter" font-size="19" font-weight="normal" fill="#9aabc0" text-anchor="middle" font-style="italic">For example:</text>
<text x="500.0" y="474" font-family="Inter" font-size="21" font-weight="normal" fill="#e8eef6" text-anchor="middle">Your dog sits, you say "yes"</text>
<text x="500.0" y="502" font-family="Inter" font-size="21" font-weight="normal" fill="#e8eef6" text-anchor="middle">and hand over a treat or toy.</text>
<rect x="756" y="206" width="488" height="343" rx="10" fill="#121a2b" stroke="#6eb6e8" stroke-width="2.5"/>
<text x="780" y="264" font-family="Inter" font-size="46" font-weight="bold" fill="#f2a65a" text-anchor="start">+P</text>
<text x="1000.0" y="350" font-family="Inter" font-size="24" font-weight="bold" fill="#e8eef6" text-anchor="middle">Add something the dog</text>
<text x="1000.0" y="382" font-family="Inter" font-size="24" font-weight="bold" fill="#e8eef6" text-anchor="middle">dislikes, so the behaviour fades.</text>
<text x="1000.0" y="440" font-family="Inter" font-size="19" font-weight="normal" fill="#9aabc0" text-anchor="middle" font-style="italic">For example:</text>
<text x="1000.0" y="474" font-family="Inter" font-size="21" font-weight="normal" fill="#e8eef6" text-anchor="middle">Your dog jumps up and feels</text>
<text x="1000.0" y="502" font-family="Inter" font-size="21" font-weight="normal" fill="#e8eef6" text-anchor="middle">a quick pop on the leash.</text>
<rect x="256" y="561" width="488" height="343" rx="10" fill="#1a2438" stroke="#6eb6e8" stroke-width="2.5"/>
<text x="280" y="619" font-family="Inter" font-size="46" font-weight="bold" fill="#6eb6e8" text-anchor="start">-R</text>
<text x="500.0" y="705" font-family="Inter" font-size="24" font-weight="bold" fill="#e8eef6" text-anchor="middle">Take away something the dog</text>
<text x="500.0" y="737" font-family="Inter" font-size="24" font-weight="bold" fill="#e8eef6" text-anchor="middle">dislikes, so the behaviour grows.</text>
<text x="500.0" y="795" font-family="Inter" font-size="19" font-weight="normal" fill="#9aabc0" text-anchor="middle" font-style="italic">For example:</text>
<text x="500.0" y="829" font-family="Inter" font-size="21" font-weight="normal" fill="#e8eef6" text-anchor="middle">The leash has light pressure;</text>
<text x="500.0" y="857" font-family="Inter" font-size="21" font-weight="normal" fill="#e8eef6" text-anchor="middle">your dog gives, and it goes slack.</text>
<rect x="756" y="561" width="488" height="343" rx="10" fill="#121a2b" stroke="#6eb6e8" stroke-width="2.5"/>
<text x="780" y="619" font-family="Inter" font-size="46" font-weight="bold" fill="#f2a65a" text-anchor="start">-P</text>
<text x="1000.0" y="705" font-family="Inter" font-size="24" font-weight="bold" fill="#e8eef6" text-anchor="middle">Take away something the dog</text>
<text x="1000.0" y="737" font-family="Inter" font-size="24" font-weight="bold" fill="#e8eef6" text-anchor="middle">wants, so the behaviour fades.</text>
<text x="1000.0" y="795" font-family="Inter" font-size="19" font-weight="normal" fill="#9aabc0" text-anchor="middle" font-style="italic">For example:</text>
<text x="1000.0" y="829" font-family="Inter" font-size="21" font-weight="normal" fill="#e8eef6" text-anchor="middle">Your dog mouths during play,</text>
<text x="1000.0" y="857" font-family="Inter" font-size="21" font-weight="normal" fill="#e8eef6" text-anchor="middle">so the toy goes away.</text>
</svg>